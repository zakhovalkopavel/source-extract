[project]
name = "source-extract"
version = "0.0.0"
description = "Source file in → structured extract out (tables, diagrams, papers)"
requires-python = ">=3.11"
dependencies = [
  "page-ocr",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
