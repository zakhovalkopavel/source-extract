[project]
name = "source-extract"
version = "0.1.0"
description = "Source file in → structured extract out (tables, diagrams, papers); CLI, API, GUI entry point"
requires-python = ">=3.11"
dependencies = [
  "page-ocr",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
llm-google = [
  "google-genai>=1.0",
]
llm-openai = [
  "openai>=1.0",
]
llm-anthropic = [
  "anthropic>=0.40",
]

[project.scripts]
source-extract = "source_extract.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
